# Defaults shown (US demo); copy to config.toml and edit. Money is in marketplace currency (USD).
data_source = "canopy"       # "canopy" (free tier, no history) or "keepa"
canopy_domain = "US"
categories = ["bestsellers_kitchen"]   # Canopy category ids (strings); Keepa uses integer ids
# Keepa alternative (needs KEEPA_API_KEY); replace the matching keys, TOML forbids duplicates:
# data_source = "keepa"
# keepa_domain = 1           # 1 = amazon.com, 10 = amazon.in
# categories = [1055398]
# max_sales_rank = 50000     # Keepa ranks are category-wide sales ranks, not list positions
price_min = 15.0
price_max = 60.0
max_sales_rank = 50          # for Canopy, the best-seller list position is the rank
min_rating = 4.0
min_reviews = 50
max_offer_count = 15
fee_pct = 0.15
shipping_cost = 5.0
est_cost_ratio = 0.35
min_margin_pct = 0.25
llm_top_n = 20
daily_llm_token_budget = 200000
max_risk_score = 60
max_order_value = 300.0
daily_spend_cap = 1000.0
max_units_per_order = 20
max_asins_per_category = 50   # best-seller lists are rank-ordered; keeps data-source use bounded
db_path = "data/dropship.db"
reports_dir = "reports"
supplier_quotes_path = "supplier_quotes.csv"
