{% extends "base.html" %}
{% block title %}Orders{% endblock %}
{% block content %}
<h1>Draft orders</h1>
<div class="tabs">
  {% for key, label in tabs %}<a href="/orders?status={{ key }}" class="{{ 'on' if key == tab }}">{{ label }}</a>{% endfor %}
</div>

{% endblock %}
